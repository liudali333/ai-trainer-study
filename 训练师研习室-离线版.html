</style></head><body><aside><a class="brand" href="#home"><b>研</b><span>训练师研习室<small>AI TRAINER · LEVEL 3</small></span></a><div class="side-label">你的考证学习空间</div><nav id="nav"></nav><div class="side-bottom"><span class="dot"></span> 本地自动保存<p>每天一点，把知识练成能力。</p><button onclick="backup()">导出学习备份 ↗</button><label class="import">导入备份<input type="file" accept="application/json" onchange="restore(event)"></label></div></aside><div class="workspace"><header><span>职业技能等级认定 <i>/</i> 三级 · 高级工</span><span class="tag">零基础友好</span></header><main id="app"></main><footer>原创学习题 · 非官方真题库　｜　学习进度保存在当前浏览器，可导出迁移</footer></div><div id="toast" role="status"></div><script>
const modules=[
['职业基础与学习入门','先认识工作，再认识 AI','基础打底'],['业务分析与流程设计','把业务问题变成可验证的任务','三级核心'],['数据清洗与标注规范','让训练数据可靠、一致、可追溯','三级核心'],['算法训练与测试评估','会划分数据，会分析错误','三级核心'],['智能系统监控与优化','把模型效果变成产品效果','三级核心'],['培训指导与实操基础','能讲清规范，也能完成操作','能力巩固']];
// 每条是一道原创概念题，同时作为一张有例子的速记卡。正确选项在生成时轮换位置。
const facts=[
[0,'监督学习','使用带标签的样本学习输入到输出的映射','只用无标签样本聚类|完全不需要训练数据|通过手工写死所有输出','给邮件标上“垃圾/正常”，让模型从这些例子学习分类。','有标准答案再学习。'],
[0,'无监督学习','从无标签数据中发现结构或分组','必须逐条提供目标标签|只能识别图像|等同于人工填写规则','将客户按购买行为聚成几类，事先并不知道每个人的类别。','没有答案，寻找规律。'],
[0,'分类与回归','分类预测离散类别，回归预测连续数值','分类只预测数值|回归只能输出类别|二者任务完全相同','判断是否流失是分类，预测下月销量是回归。','分门别类，回归数值。'],
[0,'特征与标签','特征是输入信息，标签是希望预测的目标','标签必须是个人姓名|特征就是最终预测答案|两者必须完全一致','预测房价：面积、楼层是特征，成交价格是标签。','特征是线索，标签是答案。'],
[0,'职业诚信','如实记录测试结果并保留问题证据','删除失败样本美化成绩|只报告有利指标|把估计值当实测值','模型未达标，应记录条件与失败案例，再制定改进计划。','真实、完整、可复现。'],
[0,'数据最小化','只处理完成任务必要的数据并控制访问','收集所有可获得的个人信息|把原始客户数据公开分享|长期保留所有数据不作评估','做意图识别通常不需要保留用户身份证号，应去除无关信息。','够用即可，权限最小。'],
[0,'训练师的工作闭环','从业务需求出发，组织数据、测试并反馈优化','只追求代码行数|只购买更贵的机器|完全替代所有研发岗位','客服机器人答非所问，先定位意图和数据问题，再验证改进。','需求—数据—测试—改进。'],
[0,'数据备份','保存可恢复副本并验证恢复流程','有备份文件就永远不会丢数据|只保留一个工作副本|把所有版本覆盖为最新文件','备份后尝试恢复一份样本，确认文件和标签对应关系未损坏。','能恢复的副本才有用。'],
[1,'需求澄清','先确定目标、使用对象、输入输出和验收指标','直接选择最复杂的模型|先收集全部网络数据|先优化无关页面配色','“提升客服效率”要细化为哪类问题、处理时长和转人工率。','谁用、做什么、怎样算好。'],
[1,'业务流程图','表达步骤、判断条件、责任角色与流转关系','只列硬件采购清单|只画漂亮图形|只展示最终准确率','投诉处理流程包括接收、分类、判断风险、分派和回访。','步骤有序，分支有条件。'],
[1,'采集流程设计','明确数据来源、字段、频率、授权与质量检查','只规定文件颜色|仅保证样本数量足够|跳过采集失败的记录','采集热线录音需定义音频格式、渠道、时间范围和失败补采。','来源—字段—频率—质检。'],
[1,'数据审核流程','明确审核规则、抽检方式、返工与复核闭环','发现错误后直接忽略|只审核最简单样本|审核者随意改变标签定义','抽检发现边界歧义，要回到规范仲裁，再返工并复核。','审核不止找错，还要闭环。'],
[1,'模块问题定位','分渠道和流程阶段拆解指标，定位异常环节','看到总指标下降就替换全部系统|只凭个人直觉判断|不看数据直接扩大训练轮数','总转化下降，按访问—咨询—下单拆解，查出咨询环节流失。','先拆分，再定位。'],
[1,'优化方案验收','预先定义基线、目标指标、成本约束和验证方式','上线后再随意挑一个好看的指标|只要求界面变化|只比较不同口径的数据','优化意图分类前，记录当前表现，并用同一测试集对比。','同口径，有基线。'],
[1,'样本代表性','覆盖目标场景的主要分布和关键少数情况','只选最容易的样本|只选最新一天数据|用大量重复样本代替覆盖','客服数据应涵盖渠道、用户表达方式以及少见但高风险意图。','数量不等于覆盖。'],
[1,'业务目标与模型指标','模型指标需要结合实际收益与错误代价解释','准确率提高必然收益增加|模型越大业务越好|指标可脱离场景独立决策','漏掉高风险投诉的成本可能高于多转几次人工。','指标服务目标。'],
[2,'重复数据处理','按业务键或内容识别重复并保留处理记录','所有相似文本一律删除|只按文件名判断重复|重复越多越能提升泛化','同一工单重复导出可去重，不同客户的同样问法可能应保留。','先定重复含义，再去重。'],
[2,'缺失值处理','先分析缺失原因，再选择填补、删除或缺失标记','所有缺失都填零|只要缺失就删除整张表|用测试集均值填补训练集','收入缺失不等于收入为零；中位数填补应仅在训练集拟合。','查原因，再处理。'],
[2,'异常值处理','结合业务确认是错误还是有效极端情况','所有离群点都是错误|直接把最大值删除|不记录任何清洗规则','年龄为负可能是录入错误，高额订单可能是真实大客户。','异常不必然错误。'],
[2,'标注规范','定义标签、边界、正反例、冲突规则及版本','只给一个标签名称|让每个人自由理解|每天无记录地更改规则','“退款”与“退货”需给出意图边界和复合诉求处理规则。','定义、边界、例子、仲裁。'],
[2,'标注一致性','通过交叉标注、分歧分析和仲裁改善一致性','只统计每人完成数量|强制所有标签都相同|删除所有难题','两人对同批样本独立标注后比较分歧，检查规范是否含糊。','分歧帮助改规范。'],
[2,'数据集版本管理','记录样本来源、处理规则、标签版本和变更','用一个文件反复覆盖|只保存训练后截图|只记录文件大小','v2修正了一批标签，需能找回v1以对比模型效果变化。','来源可查，变化可追。'],
[2,'分层抽样','按关键类别保持或有计划地调整抽样覆盖','随机只抽同一类别|只抽第一百条之前的数据|完全忽略小类别','少数类较少时，分层抽样能避免抽检中完全缺席。','先分层，再抽取。'],
[2,'数据泄漏','训练时使用了预测时不应获得的信息','训练集样本数量较多|模型训练速度较快|正常保存训练日志','预测是否违约，却把事后催收结果作为特征，会夸大效果。','未来答案不能提前看。'],
[2,'归一化与标准化','变换特征尺度且变换参数只由训练集学习','用全部数据先拟合再划分|把所有特征变成标签|保证任何模型精度都提高','先划分数据，再用训练集均值和标准差处理验证与测试集。','先划分，后拟合。'],
[2,'训练数据质检','同时检查格式、完整性、标签质量与分布','只检查能否打开文件|只统计文件总数|只检查文件扩展名','图片能打开但标注框位置错误，仍然是不合格训练数据。','能读不等于能用。'],
[3,'训练验证测试划分','训练集拟合，验证集调参，测试集作最终评估','测试集用于反复调参|验证集必须与训练集重复|三个集合可以完全相同','像学习、模拟练习和最后考试：不能背过考卷再宣称泛化好。','训练学，验证调，测试考。'],
[3,'过拟合','训练表现好但新数据表现差','训练与测试都很差|数据读取失败|模型从未训练','模型记住训练样本细节，可尝试正则化、早停或增加有效数据。','会背题，不会迁移。'],
[3,'欠拟合','模型不能充分学习数据规律，训练表现也较差','训练接近完美但测试很差|测试数据被用于调参|保存了多个版本','模型过于简单或训练不足时，需检查特征、容量与训练设置。','连练习题都没学会。'],
[3,'精确率 Precision','TP / (TP + FP)','TP / (TP + FN)|TN / (TN + FP)|(TP + FN) / 总数','预测为正的样本里，真正为正的比例；关注误报。','查得准：报出的有多少是真的。'],
[3,'召回率 Recall','TP / (TP + FN)','TP / (TP + FP)|FP / (FP + TN)|TN / 总数','真实为正的样本里，被找出来的比例；关注漏报。','找得全：真的有多少被找到。'],
[3,'F1 分数','精确率与召回率的调和平均数','准确率与损失的相加|只看真负例的比例|训练时间的平均数','F1=2PR/(P+R)，当其中一项很低时，F1会受到明显影响。','兼顾准与全。'],
[3,'类别不平衡评估','结合混淆矩阵、各类召回率和F1等判断','只看总体准确率|只预测多数类就一定最好|把少数类从测试中删除','99%是正常样本，全预测正常也有99%准确率，却抓不到异常。','高准确率可能掩盖漏检。'],

function practice(){if(session&&!session.exam){drawQuestion();return}$('#app').innerHTML=heading('题目练习','先分章理解，再混合练习。每次提交都有解析，答错自动进入错题库。')+`<div class="toolbar">${moduleSelect()}<select aria-label="题型" onchange="filterType=this.value;render()">${['all','单选','多选','判断'].map(t=>`<option value="${t}" ${filterType===t?'selected':''}>${t==='all'?'全部题型':t}</option>`).join('')}</select><input type="search" placeholder="搜索知识点，如：召回率" value="${esc(filterText)}" oninput="filterText=this.value;document.getElementById('qcount').textContent=pool().length"><button class="primary" onclick="startFiltered()">开始练习 →</button></div><p class="muted">当前范围 <b id="qcount">${pool().length}</b> 题 · 多选题须全部选对，不设部分分</p><div class="cards">${modules.map((m,i)=>`<section class="card"><span class="pill">${m[2]}</span><h2 style="margin-top:15px">${m[0]}</h2><p class="muted">${m[1]}</p><div class="row"><span class="muted">${questions.filter(q=>q.m===i).length} 道题</span><button onclick="startPractice('${i}',999)">分章练习 →</button></div></section>`).join('')}</div><div class="actions"><button onclick="startList(state.stars,'收藏练习')">练习收藏题（${state.stars.length}）</button><button onclick="startList(questions.filter(q=>!state.history.some(h=>h.id===q.id)).map(q=>q.id),'未做题练习')">只练未做题</button></div>`}
function startFiltered(){startList(shuffled(pool()).map(q=>q.id),'筛选练习')}
function startPractice(m,n){startList(shuffled(questions.filter(q=>m==='all'||q.m==m)).slice(0,n).map(q=>q.id),'专项练习')}
function startList(ids,title){if(!ids.length){toast('当前没有符合条件的题目');return}session={ids,title,answers:{},exam:false};pos=0;selection=[];revealed=false;result=null;location.hash='practice';page='practice';render()}
function drawQuestion(){let q=qby(session.ids[pos]),record=session.answers[q.id];selection=record?[...record]:selection;let examMode=session.exam;let submitted=!examMode&&revealed;let ok=eq(selection,q.answer);$('#app').innerHTML=heading(examMode?'模拟考试进行中':session.title,examMode?'答案自动暂存；切换页面或刷新不会停止计时。交卷后查看解析。':'认真理解每个选项，比记住答案字母更重要。')+`<div class="row"><span class="pill">${modules[q.m][0]} · ${q.type}</span><span>${examMode?'<b id="timer"></b>　':''}${pos+1} / ${session.ids.length}</span></div><div class="progress"><div style="width:${(pos+1)/session.ids.length*100}%"></div></div><section class="card" style="margin-top:22px"><div class="row"><span class="muted">${q.id.toUpperCase()} · 原创学习题</span>${examMode?'':`<button onclick="star('${q.id}')">${state.stars.includes(q.id)?'★ 已收藏':'☆ 收藏'}</button>`}</div><h2 class="question">${esc(q.stem)}</h2>${q.type==='多选'?'<p class="muted">请选择所有符合条件的选项。</p>':''}<div class="options">${q.options.map((o,i)=>`<button class="option ${selection.includes(i)?'selected':''} ${submitted&&q.answer.includes(i)?'correct':''} ${submitted&&selection.includes(i)&&!q.answer.includes(i)?'wrong':''}" onclick="choose(${i})" ${submitted?'disabled':''}><b>${'ABCD'[i]}</b>${esc(o)}</button>`).join('')}</div>${submitted?`<div class="explain ${ok?'':'error'}"><b>${ok?'回答正确，继续保持':'这里值得再复习一次'}</b><p>正确答案：${q.answer.map(i=>'ABCD'[i]).join('、')}</p>${esc(q.explain)}</div><label class="muted">我的笔记</label><textarea placeholder="用自己的话记住为什么……" oninput="state.notes['${q.id}']=this.value;save()">${esc(state.notes[q.id]||'')}</textarea>`:''}<div class="actions">${examMode?`<button onclick="move(-1)" ${pos===0?'disabled':''}>上一题</button><button class="primary" onclick="move(1)" ${pos===session.ids.length-1?'disabled':''}>下一题</button><button onclick="finishExam(false)">交卷</button>`:`${!submitted?'<button class="primary" onclick="submitPractice()">提交答案</button>':`<button class="primary" onclick="nextPractice()">${pos===session.ids.length-1?'查看练习结果':'下一题 →'}</button>`}<button onclick="session=null;practice()">结束本组</button>`}</div></section>${examMode?`<section class="card" style="margin-top:20px"><h3>答题卡 <small class="muted">浅绿表示已作答</small></h3><div class="answer-grid">${session.ids.map((id,i)=>`<button class="${session.answers[id]?.length?'done':''} ${i===pos?'current':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div></section>`:''}`;if(examMode)tick()}
function choose(i){if(revealed&&!session.exam)return;let q=qby(session.ids[pos]);selection=q.type==='多选'?(selection.includes(i)?selection.filter(x=>x!==i):[...selection,i]):[i];if(session.exam){session.answers[q.id]=selection;state.activeExam=session;save()}drawQuestion()}
function recordAnswer(q,ans,mode){let ok=eq(ans,q.answer);state.history.push({id:q.id,ok,at:Date.now(),mode});if(!ok){let old=state.wrong[q.id]||{count:0};state.wrong[q.id]={...old,count:old.count+1,mastered:false,last:Date.now(),answer:ans}}else if(state.wrong[q.id]){state.wrong[q.id].mastered=true}activity();return ok}
function submitPractice(){if(!selection.length){toast('请先选择答案');return}let q=qby(session.ids[pos]);session.answers[q.id]=[...selection];recordAnswer(q,selection,'practice');save();revealed=true;drawQuestion()}
function nextPractice(){if(pos<session.ids.length-1){pos++;selection=[];revealed=false;drawQuestion()}else{let correct=session.ids.filter(id=>eq(session.answers[id]||[],qby(id).answer)).length;$('#app').innerHTML=heading('这一组，练完了。','复盘错误原因，再进入下一组。')+`<section class="card empty"><div class="score">${pct(correct,session.ids.length)}<small>%</small></div><p>答对 ${correct} / ${session.ids.length} 题；错题已自动整理。</p><button class="primary" onclick="session=null;go('wrong')">复习错题 →</button> <button onclick="session=null;practice()">返回练习</button></section>`;session=null}}
function star(id){state.stars=state.stars.includes(id)?state.stars.filter(x=>x!==id):[...state.stars,id];save();drawQuestion()}
function wrong(){let ids=Object.keys(state.wrong).filter(id=>qby(id)&&(filterModule==='all'||qby(id).m==filterModule)),pending=ids.filter(id=>!state.wrong[id].mastered);$('#app').innerHTML=heading('把错题，变成拿手题。','答错自动收录；再次答对会标记已掌握。已掌握题仍保留，便于回看。')+`<div class="toolbar">${moduleSelect()}<button class="primary" onclick="startList(${JSON.stringify(pending).replace(/"/g,'&quot;')},'错题重练')">重练待巩固（${pending.length}）</button><button onclick="startList(${JSON.stringify(ids).replace(/"/g,'&quot;')},'全部错题回顾')">重练全部</button></div>${!ids.length?'<section class="card empty"><h2>这里暂时没有错题</h2><p class="muted">开始练习后，答错的题会自动来到这里。</p><button class="primary" onclick="go(\'practice\')">去练习</button></section>':ids.sort((a,b)=>state.wrong[b].count-state.wrong[a].count).map(id=>{let q=qby(id),w=state.wrong[id];return `<section class="card" style="margin-bottom:14px"><div class="row"><span class="pill">${w.mastered?'已掌握':'待巩固'} · 累计错 ${w.count} 次</span><span class="muted">${modules[q.m][0]}</span></div><h3 style="margin-top:15px">${esc(q.stem)}</h3><details><summary>查看正确答案与解析</summary><p>${q.answer.map(i=>`${'ABCD'[i]}．${esc(q.options[i])}`).join('<br>')}</p><p class="muted">${esc(q.explain)}</p>${state.notes[id]?`<p class="note">我的笔记：${esc(state.notes[id])}</p>`:''}</details><div class="actions"><button onclick="startList(['${id}'],'单题巩固')">再练一次</button><button onclick="state.wrong['${id}'].mastered=!state.wrong['${id}'].mastered;save();wrong()">${w.mastered?'重新加入待巩固':'标记已掌握'}</button></div></section>`}).join('')}`}
function cards(){let ids=facts.map((f,i)=>i).filter(i=>filterModule==='all'||facts[i][0]==filterModule);cardIndex=Math.min(cardIndex,ids.length-1);let id=ids[cardIndex],f=facts[id];$('#app').innerHTML=heading('要点速记，先懂再记。','先尝试用自己的话回答，再翻面看解释。掌握后可直接练对应题。')+`<div class="toolbar">${moduleSelect()}<span class="muted">已掌握 ${state.learned.length} / ${facts.length} 个要点</span></div><section class="card" style="min-height:310px;padding:35px"><div class="row"><span class="pill">${modules[f[0]][0]}</span><span class="muted">${cardIndex+1} / ${ids.length}</span></div><h2 style="font-size:30px;margin-top:30px">${f[1]}</h2>${flipped?`<p style="font-size:19px">${f[2]}</p><p class="note">举个例子：${f[4]}</p><p><b>一句话记忆：</b>${f[5]}</p>`:'<p class="muted">它是什么意思？遇到实际任务时，你会怎么做？</p><p class="eyebrow">先想一想 · 再揭晓</p>'}<div class="actions"><button class="primary" onclick="flipped=!flipped;cards()">${flipped?'收起解释':'翻卡查看解释 ↻'}</button><button onclick="toggleLearned(${id})">${state.learned.includes(id)?'✓ 已掌握，重新学习':'标记已掌握'}</button><button onclick="startList(['q${id+1}'],'要点练习')">练一道对应题 →</button></div></section><div class="row" style="margin-top:18px"><button onclick="cardIndex--;flipped=false;cards()" ${cardIndex===0?'disabled':''}>← 上一个</button><button onclick="cardIndex++;flipped=false;cards()" ${cardIndex===ids.length-1?'disabled':''}>下一个 →</button></div><section class="card" style="margin-top:24px"><h2>要点目录</h2><div class="tabs">${ids.map((j,i)=>`<button class="${i===cardIndex?'active':''}" onclick="cardIndex=${i};flipped=false;cards();window.scrollTo(0,0)">${state.learned.includes(j)?'✓ ':''}${facts[j][1]}</button>`).join('')}</div></section>`}
function toggleLearned(id){state.learned=state.learned.includes(id)?state.learned.filter(x=>x!==id):[...state.learned,id];activity();save();cards()}
function exam(){if(state.activeExam){session=state.activeExam;pos=Math.min(session.pos||0,session.ids.length-1);selection=session.answers[session.ids[pos]]||[];drawQuestion();return}if(result){showExamResult(result);return}$('#app').innerHTML=heading('模拟考试，检验真实掌握。','闭卷计时，交卷后统一评分。练习卷为本站自定义，不代表当地正式考试题型和配比。')+`<div class="cards"><section class="card"><span class="pill">轻量自测</span><h2 style="margin-top:20px">20 分钟 · 快速检测</h2><p class="muted">从六个模块抽取 20 题，适合完成一轮学习后检验薄弱点。</p><button class="primary" onclick="startExam(20,20)">开始自测 →</button></section><section class="card"><span class="pill">综合训练</span><h2 style="margin-top:20px">90 分钟 · 综合模拟</h2><p class="muted">随机抽取 60 题。百分制等权计分，60 分为本站练习参考线。</p><button class="primary" onclick="startExam(60,90)">开始综合模拟 →</button></section></div><section class="card" style="margin-top:25px"><h2>考试记录</h2>${state.exams.length?`<table><thead><tr><th>时间</th><th>题量</th><th>成绩</th><th>复盘</th></tr></thead><tbody>${state.exams.slice().reverse().map(e=>`<tr><td>${new Date(e.at).toLocaleString('zh-CN')}</td><td>${e.ids.length}</td><td>${e.score} 分</td><td><button onclick="result=state.exams.find(x=>x.at===${e.at});showExamResult(result)">查看</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted">还没有考试记录。第一次成绩是起点，后续复盘才是提升的关键。</p>'}</section><p class="note" style="margin-top:20px">理论模拟不能替代技能考核准备。建议同时完成“实操训练”，并核对评价机构要求的具体软件、题型和操作流程。</p>`}
function startExam(n,min){let ids=[];modules.forEach((_,m)=>ids.push(...shuffled(questions.filter(q=>q.m===m)).slice(0,Math.floor(n/6)).map(q=>q.id)));ids.push(...shuffled(questions.filter(q=>!ids.includes(q.id))).slice(0,n-ids.length).map(q=>q.id));session={exam:true,ids:shuffled(ids),answers:{},end:Date.now()+min*60000,started:Date.now(),pos:0};state.activeExam=session;save();pos=0;selection=[];revealed=false;exam()}
function jump(i){pos=i;session.pos=i;selection=session.answers[session.ids[i]]||[];state.activeExam=session;save();drawQuestion()}
function move(d){jump(Math.max(0,Math.min(session.ids.length-1,pos+d)))}
function tick(){let active=state.activeExam;if(!active)return;let secs=Math.max(0,Math.ceil((active.end-Date.now())/1000));if($('#timer'))$('#timer').textContent=`剩余 ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}`;if(!secs)finishExam(true)}
setInterval(tick,1000);
function finishExam(auto){let s=state.activeExam;if(!s)return;let unanswered=s.ids.filter(id=>!s.answers[id]?.length).length;if(!auto&&!confirm(`确认交卷？${unanswered?'还有 '+unanswered+' 题未作答，将按错误计分。':'交卷后不能修改答案。'}`))return;let right=0;s.ids.forEach(id=>{if(recordAnswer(qby(id),s.answers[id]||[],'exam'))right++});result={...s,at:Date.now(),score:Math.round(right/s.ids.length*10000)/100,right,auto};state.exams.push(result);state.activeExam=null;session=null;save();go('exam');showExamResult(result)}
function showExamResult(e){$('#app').innerHTML=heading('考试复盘','分数告诉你现在的位置，错因告诉你下一步怎么走。')+`<section class="card"><div class="row"><div><div class="score">${e.score}<small style="font-size:18px"> / 100</small></div><p>${e.score>=60?'达到本站练习参考线，继续加强实操。':'还需巩固，建议先学习错误集中的模块。'}<br><span class="muted">答对 ${e.right}/${e.ids.length} · ${e.auto?'到时自动交卷':'手动交卷'}</span></p></div><button onclick="result=null;exam()">返回考试中心</button></div><div class="stats">${modules.map((m,i)=>{let ids=e.ids.filter(id=>qby(id).m===i);return `<div><span class="muted">${m[0]}</span><h3>${ids.filter(id=>eq(e.answers[id]||[],qby(id).answer)).length} / ${ids.length}</h3></div>`}).join('')}</div></section><section class="card" style="margin-top:24px"><h2>逐题解析</h2>${e.ids.map((id,i)=>{let q=qby(id),ans=e.answers[id]||[],ok=eq(ans,q.answer);return `<details><summary>${ok?'✓':'○'} ${i+1}. ${esc(q.stem)}</summary><p class="muted">${q.options.map((o,j)=>`${'ABCD'[j]}．${esc(o)}`).join('<br>')}</p><p>你的答案：${ans.length?ans.map(j=>'ABCD'[j]).join('、'):'未作答'}　正确答案：${q.answer.map(j=>'ABCD'[j]).join('、')}</p><p class="note">${esc(q.explain)}</p></details>`}).join('')}</section>`}
function casesPage(){ $('#app').innerHTML=heading('实操训练，把知识用起来。','5 个典型任务 · 写下方案 · 对照步骤自查。自评用于学习反馈，不等于正式技能考试评分。')+cases.map((c,i)=>`<section class="card" style="margin-bottom:20px"><span class="pill">案例 0${i+1} · ${modules[c.m][0]}</span><h2 style="margin-top:16px">${c.title}</h2><p>${c.brief}</p><label class="muted" for="case${i}">我的作答（自动保存）</label><textarea id="case${i}" placeholder="按目标、步骤、质量检查、结果验证来写……" oninput="state.caseAnswers[${i}]=this.value;activity();save()">${esc(state.caseAnswers[i]||'')}</textarea><details><summary>查看参考思路与自查清单</summary><p class="note">${c.answer}</p>${c.steps.map((s,j)=>`<label style="display:block;margin:10px 0"><input type="checkbox" ${(state.caseChecks[i]||[]).includes(j)?'checked':''} onchange="caseCheck(${i},${j},this.checked)"> ${s}</label>`).join('')}<p class="muted">请只勾选你的作答确实覆盖的项目；未覆盖项就是下一次改进目标。</p></details></section>`).join('')}
function caseCheck(i,j,on){let a=state.caseChecks[i]||[];state.caseChecks[i]=on?[...new Set([...a,j])]:a.filter(x=>x!==j);activity();save()}
function guide(){let schedule=['认识职业与AI概念','分类回归与数据基础','需求澄清与流程图','业务拆解与验收指标','数据清洗与质量检查','标注规则与一致性','复习前六天错题','训练验证测试划分','指标计算与错误分析','监控优化与灰度回滚','培训指导与实操案例','综合模拟与复盘','重练薄弱模块','速记回顾与考前核对'];$('#app').innerHTML=heading('零基础备考指南','先建立框架，再反复练习。学习安排可以按自己的时间拉长，不必机械追赶。')+`<section class="card"><h2>14 天学习路线</h2><p class="muted">每天建议 30–60 分钟用于本项目；实际学习时长取决于基础与当地考核要求。点击一天可标记完成。</p><div class="steps">${schedule.map((s,i)=>`<button class="step ${state.plan.includes(i)?'done':''}" onclick="state.plan=state.plan.includes(${i})?state.plan.filter(x=>x!==${i}):[...state.plan,${i}];activity();save();guide()"><b>${state.plan.includes(i)?'✓':String(i+1).padStart(2,'0')}</b>${s}</button>`).join('')}</div></section><div class="cards" style="margin-top:22px"><section class="card"><h2>先学什么？</h2><p>① 用“职业基础”理解特征、标签和任务类型。</p><p>② 以业务流程、数据规范、测试评估、产品优化为主线学习。</p><p>③ 每个要点先用自己的话解释，再练题验证。</p><p>④ 能答对之后，还要能写出实操方案并解释原因。</p></section><section class="card"><h2>怎么用错题库？</h2><p>答错 → 阅读解析 → 写一句自己的错因 → 隔天重练。</p><p>再次答对会标记“已掌握”，但历史错题保留，可再次练习。</p><p>如果靠记字母答对，建议重新加入待巩固，重点解释每个错误选项。</p></section></div><section class="card" style="margin-top:22px"><h2>考试范围与资料来源</h2><p>本项目参考《人工智能训练师国家职业技能标准（2021年版）》的职业能力框架，结合通用数据与测试知识编写原创学习内容。三级对应高级工，学习应兼顾理论理解与技能操作。</p><p>题库不是官方题库，不声称覆盖当地全部考点。20分钟与90分钟练习卷、抽题数量及等权评分均为本站训练设计。</p><p>报考前请向评价机构核对：最新适用标准、报名条件、考试日期、理论题型、技能软件与操作要求、合格规则。本文不提供报名资格判定。</p><p><a href="https://www.osta.org.cn/api/sys/downloadFile/decrypt?fileName=4eNsZIOv3WFNDfbnldJHeA%2F2024%2F4%2F29%2F6761815658ea468cbc0caa8974357703.pdf" target="_blank" rel="noopener">技能人才评价工作网：国家职业技能标准（2021年版） ↗</a></p><p><a href="https://www.mohrss.gov.cn/wap/zc/zqyj/202106/W020210617509883457681.pdf" target="_blank" rel="noopener">人力资源社会保障部：标准相关公开资料 ↗</a></p><p class="muted">内容核对日期：2026-10-26。页面中的标准参考用于能力框架定位；实际认定安排以评价机构当期公告为准。</p></section><section class="card" style="margin-top:22px"><h2>学习数据与备份</h2><p>进度、错题、笔记、实操作答和考试记录保存在当前设备的浏览器中，不自动跨设备同步。更换浏览器或清除浏览器数据前，请导出备份。</p><button onclick="backup()">导出完整学习备份</button> <label class="import">导 function metricsLab(){return `<span class="pill">任务1 · 算法评估</span><h2 style="margin-top:15px">算出模型的“准”与“全”</h2><p>将“投诉”定义为正类。测试结果：TP=60、FP=20、FN=40、TN=880。填写百分数，不要输入%号；保留一位小数。</p>${tableHTML([{实际:'投诉（正）',预测投诉:60,预测非投诉:40},{实际:'非投诉（负）',预测投诉:20,预测非投诉:880}])}<div class="toolbar">${['精确率 Precision','召回率 Recall','F1'].map((s,i)=>`<label>${s}<input aria-label="${s}" id="metric${i}" type="number" min="0" max="100" step="0.1" value="${esc(metricDraft[i])}" oninput="metricDraft[${i}]=this.value" style="display:block;width:150px"></label>`).join('')}</div><button class="primary" onclick="gradeMetrics()">提交并计算</button><details><summary>查看公式提示</summary><p>P=TP/(TP+FP)，R=TP/(TP+FN)，F1=2TP/(2TP+FP+FN)。</p></details>`}
function gradeMetrics(){let vals=[0,1,2].map(i=>$('#metric'+i).value);if(vals.some(v=>v.trim()===''||!Number.isFinite(Number(v))||Number(v)<0||Number(v)>100)){toast('请填写三个0–100之间的有效百分数');return}metricDraft=vals;let expected=[75,60,66.6666667],ok=vals.map((v,i)=>Math.abs(Number(v)-expected[i])<=.11),score=Math.round(ok.filter(Boolean).length/3*100);saveLab('metrics',score,{answers:vals});feedback(`本次 ${score} 分`,['精确率=60/(60+20)=75%','召回率=60/(60+40)=60%','F1=120/(120+20+40)≈66.7%'].map((s,i)=>`<p>${ok[i]?'✓':'○'} ${s}</p>`).join('')+'<p class="note">准确率为94%，但召回率只有60%，仍漏掉了40%的投诉。不要只用总体准确率判断投诉识别效果。</p>')}
function cleanLab(){return `<span class="pill">任务2 · 清洗流水线</span><h2 style="margin-top:15px">按规则真正处理一份数据</h2><p>任务：按id保留首条、清除姓名两端空格、将负年龄转为空值，再用有效年龄中位数填补。教学样本独立使用；真实建模须先划分数据，填补参数只在训练集拟合。</p>${tableHTML(rawRows)}<div class="toolbar"><label><input type="checkbox" id="cleanDedupe" ${cleanConfig.dedupe?'checked':''}> 按id去重</label><label><input type="checkbox" id="cleanTrim" ${cleanConfig.trim?'checked':''}> 姓名去空格</label><label><input type="checkbox" id="cleanInvalid" ${cleanConfig.invalid?'checked':''}> 负年龄转空值</label><label>空值处理 <select id="cleanMissing">${selectOptions([['keep','保留空值'],['zero','填零'],['median','有效年龄中位数']],cleanConfig.missing)}</select></label></div><div class="actions"><button class="primary" onclick="runClean()">执行清洗并检查</button><button onclick="downloadRows('原始清洗样本.csv',rawRows)">下载原始CSV</button></div>`}
function cleanRows(config){let rows=rawRows.map(r=>({...r})),log=[];if(config.dedupe){let seen=new Set();rows=rows.filter(r=>{if(seen.has(r.id))return false;seen.add(r.id);return true});log.push(`按id去重：${rawRows.length}→${rows.length}行`)}if(config.trim){rows.forEach(r=>r.name=r.name.trim());log.push('姓名字段已去除两端空格')}if(config.invalid){let n=0;rows.forEach(r=>{if(r.age!==null&&r.age<0){r.age=null;n++}});log.push(`${n}条负年龄转为空值`)}let fill=null;if(config.missing==='median'){let nums=rows.map(r=>r.age).filter(x=>x!==null&&x>=0).sort((a,b)=>a-b);if(!nums.length)throw Error('无有效年龄，无法计算中位数');fill=nums.length%2?nums[(nums.length-1)/2]:(nums[nums.length/2-1]+nums[nums.length/2])/2}else if(config.missing==='zero')fill=0;if(fill!==null){let n=0;rows.forEach(r=>{if(r.age===null){r.age=fill;n++}});log.push(`填补${n}条空值，填充值=${fill}`)}return {rows,log}}
function runClean(){cleanConfig={dedupe:$('#cleanDedupe').checked,trim:$('#cleanTrim').checked,invalid:$('#cleanInvalid').checked,missing:$('#cleanMissing').value};let out=cleanRows(cleanConfig),checks=[out.rows.length===7,out.rows.every(r=>r.name===r.name.trim()),out.rows.every(r=>r.age>=0&&r.age!==null),['A02','A03','A06'].every(id=>out.rows.find(r=>r.id===id)?.age===33)];let score=checks.filter(Boolean).length*25;labOutput=out.rows;saveLab('clean',score,{config:cleanConfig,log:out.log});feedback(`清洗完成 · ${score} 分`,tableHTML(out.rows)+out.log.map(s=>`<p class="muted">${esc(s)}</p>`).join('')+['去重后7条','姓名无首尾空格','年龄无负数与空值','三个待填补年龄都为33（24、30、36、42的中位数）'].map((s,i)=>`<p>${checks[i]?'✓':'○'} ${s}</p>`).join('')+'<button onclick="downloadRows(\'清洗结果.csv\',labOutput)">下载清洗结果CSV</button>')}

function gradeLabels(){let ans=annotationRows.map((_,i)=>$('#label'+i).value);if(ans.some(x=>!x)){toast('请先完成全部8条标注');return}let n=ans.filter((a,i)=>a===annotationRows[i][1]).length,score=Math.round(n/8*100);labelDraft=Object.fromEntries(ans.map((a,i)=>[i,a]));saveLab('label',score,{answers:labelDraft});feedback(`标注一致率 ${score}% · ${n}/8`,annotationRows.map((r,i)=>`<p>${ans[i]===r[1]?'✓':'○'} 第${i+1}条：${r[1]}。${r[2]}</p>`).join('')+'<p class="muted">这里的一致率是与本任务预设规范答案的对比，不代表实际多人标注的Kappa指标。</p>')}

function sqlLab(){return `<span class="pill">任务5 · 查询沙盒</span><h2 style="margin-top:15px">找出尚未标注的样本</h2><p>任务：从 samples 表中筛选 label 为空的记录，结果至少包含 id 列。输入SQL后会在下表上实际执行。</p>${tableHTML(sqlRows)}<label for="sqlInput">SQL语句</label><textarea id="sqlInput" spellcheck="false" oninput="sqlDraft=this.value">${esc(sqlDraft)}</textarea><button class="primary" onclick="runSql()">运行查询并判分</button><details><summary>支持的SQL范围与示例</summary><p>本沙盒实现教学用SELECT子集：字段投影、COUNT(*)、WHERE（IS NULL / IS NOT NULL / = / &gt; / &gt;= / &lt; / &lt;=），单个条件，不支持连接、子查询、写入或完整数据库语法。</p><pre>SELECT id, text FROM samples WHERE label IS NULL;
SELECT * FROM samples WHERE score &gt;= 0.8;
SELECT COUNT(*) FROM samples WHERE label = '物流';</pre></details>`}
function queryRows(sql){let match=sql.trim().match(/^SELECT\s+(.+?)\s+FROM\s+samples(?:\s+WHERE\s+(.+?))?\s*;?$/i);if(!match)throw Error('仅支持 SELECT 字段 FROM samples [WHERE 单个条件]');let fields=match[1].trim(),cond=(match[2]||'').replace(/;$/,'').trim(),rows=sqlRows.map(r=>({...r}));if(cond){let nullM=cond.match(/^(id|text|label|score)\s+IS\s+(NOT\s+)?NULL$/i),cmp=cond.match(/^(id|text|label|score)\s*(>=|<=|=|>|<)\s*(?:'([^']*)'|(-?\d+(?:\.\d+)?))$/i);if(nullM){let key=nullM[1].toLowerCase();rows=rows.filter(r=>nullM[2]?r[key]!==null:r[key]===null)}else if(cmp){let key=cmp[1].toLowerCase(),op=cmp[2],value=cmp[3]!==undefined?cmp[3]:Number(cmp[4]);rows=rows.filter(r=>{if(r[key]===null)return false;let v=r[key];if(typeof v!==typeof value)throw Error('比较值类型与字段不匹配');return op==='='?v===value:op==='>'?v>value:op==='<'?v<value:op==='>='?v>=value:v<=value})}else throw Error('WHERE条件不受支持；空值请用IS NULL，而不是= NULL')}if(/^COUNT\(\*\)$/i.test(fields))return[{count:rows.length}];let keys=fields==='*'?Object.keys(sqlRows[0]):fields.split(',').map(s=>s.trim().toLowerCase());if(keys.some(k=>!Object.keys(sqlRows[0]).includes(k))||new Set(keys).size!==keys.length)throw Error('字段不存在或重复，可用id、text、label、score');return rows.map(r=>Object.fromEntries(keys.map(k=>[k,r[k]])))}
function runSql(){sqlDraft=$('#sqlInput').value;try{let rows=queryRows(sqlDraft),ids=rows.map(r=>r.id).sort(),correct=ids.length===2&&ids[0]==='S02'&&ids[1]==='S05';labOutput=rows;saveLab('sql',correct?100:0,{query:sqlDraft});feedback(correct?'任务完成 · 100分':'查询已执行，尚未满足任务',tableHTML(rows)+`<p class="note">${correct?'已正确筛选两条未标注记录。':'任务要求结果至少含id，且只包含S02与S05。注意：NULL用IS NULL判断，不是字符串“NULL”。'}</p><button onclick="downloadRows('SQL查询结果.csv',labOutput)">下载查询结果</button>`)}catch(e){feedback('查询未执行',`<p>${esc(e.message)}</p>`)} }

function backup(){downloadFile(`训练师学习备份-${today()}.json`,JSON.stringify({...state,version:2},null,2));toast('已导出：学习记录、实操作答及自有题库')}
function validateBackup(d){if(!safeObject(d)||![1,2].includes(d.version))throw Error('不支持的备份版本');const arrs=['history','stars','learned','days','exams','plan'];if(arrs.some(k=>!Array.isArray(d[k])))throw Error('备份缺少记录数组');const objs=['wrong','notes','caseAnswers','caseChecks'];if(objs.some(k=>!safeObject(d[k])))throw Error('备份缺少必要字段');let custom=d.custom||[];if(!Array.isArray(custom)||custom.length>10000||!custom.every(q=>validQuestion(q)&&q.id.startsWith('custom-')))throw Error('自有题库损坏');if(new Set(custom.map(q=>q.id)).size!==custom.length)throw Error('题号重复');let all=[...questions.filter(q=>!q.id.startsWith('custom-')),...custom],map=new Map(all.map(q=>[q.id,q]));let answers=(id,a)=>map.has(id)&&Array.isArray(a)&&new Set(a).size===a.length&&a.every(i=>Number.isInteger(i)&&i>=0&&i<map.get(id).options.length);if(!d.history.every(h=>safeObject(h)&&map.has(h.id)&&typeof h.ok==='boolean'&&Number.isFinite(h.at)&&(!h.answer||answers(h.id,h.answer))))throw Error('作答记录无效');if(!d.stars.every(id=>map.has(id))||!d.learned.every(i=>Number.isInteger(i)&&i>=0&&i<facts.length)||!d.days.every(s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s))||!d.plan.every(i=>Number.isInteger(i)&&i>=0&&i<14))throw Error('学习进度无效');if(typeof d.date!=='string'||(d.date&&!/^\d{4}-\d{2}-\d{2}$/.test(d.date)))throw Error('日期无效');if(!Object.entries(d.wrong).every(([id,w])=>map.has(id)&&safeObject(w)&&Number.isInteger(w.count)&&w.count>=0&&typeof w.mastered==='boolean'))throw Error('错题记录无效');if(!Object.values(d.notes).every(v=>typeof v==='string')||!Object.values(d.caseAnswers).every(v=>typeof v==='string')||!Object.values(d.caseChecks).every(v=>Array.isArray(v)&&v.every(Number.isInteger)))throw Error('笔记格式无效');let checkSession=s=>{if(!safeObject(s)||!Array.isArray(s.ids)||!s.ids.length||new Set(s.ids).size!==s.ids.length||!s.ids.every(id=>map.has(id))||!safeObject(s.answers)||!Object.entries(s.answers).every(([id,a])=>s.ids.includes(id)&&answers(id,a)))return false;if(s.pos!==undefined&&(!Number.isInteger(s.pos)||s.pos<0||s.pos>=s.ids.length))return false;if(s.orders&&!Object.entries(s.orders).every(([id,order])=>map.has(id)&&answers(id,order)&&order.length===map.get(id).options.length))return false;if(s.flags&&(!Array.isArray(s.flags)||!s.flags.every(id=>s.ids.includes(id))))return false;return true};if(!d.exams.every(e=>checkSession(e)&&Number.isFinite(e.at)&&Number.isFinite(e.score)&&e.score>=0&&e.score<=100&&Number.isFinite(e.right)))throw Error('考试记录无效');if(d.activeExam&&(!checkSession(d.activeExam)||!Number.isFinite(d.activeExam.end)||!Number.isFinite(d.activeExam.started)||d.activeExam.exam!==true))throw Error('续考数据无效');if(d.activePractice&&(!checkSession(d.activePractice)||!safeObject(d.activePractice.submitted)||!Object.entries(d.activePractice.submitted).every(([id,v])=>d.activePractice.ids.includes(id)&&v===true)))throw Error('续练数据无效');if(d.reviews&&(!safeObject(d.reviews)||!Object.entries(d.reviews).every(([id,r])=>map.has(id)&&safeObject(r)&&Number.isFinite(r.due)&&Number.isInteger(r.streak)&&r.streak>=0)))throw Error('复习计划无效');if(d.causes&&(!safeObject(d.causes)||!Object.values(d.causes).every(v=>typeof v==='string')))throw Error('错因格式无效');if(d.labs){if(!safeObject(d.labs)||!Object.entries(d.labs).every(([id,v])=>Object.hasOwn(labNames,id)&&safeObject(v)&&Number.isFinite(v.score)&&v.score>=0&&v.score<=100&&Number.isFinite(v.at)))throw Error('实操记录无效');if(d.labs.metrics?.answers&&(!Array.isArray(d.labs.metrics.answers)||d.labs.metrics.answers.length!==3))throw Error('指标练习记录无效');if(d.labs.flow?.order&&(!Array.isArray(d.labs.flow.order)||d.labs.flow.order.length!==8||new Set(d.labs.flow.order).size!==8||!d.labs.flow.order.every(i=>Number.isInteger(i)&&i>=0&&i<8)))throw Error('流程顺序无效');if(d.labs.sql?.query&&typeof d.labs.sql.query!=='string')throw Error('查询记录无效')}return true}
function validBackup(d){try{return validateBackup(d)}catch{return false}}
async function restore(ev){let f=ev.target.files[0];if(!f)return;try{if(f.size>20e6)throw Error('备份超过20MB');let d=JSON.parse(await f.text());validateBackup(d);if(!confirm('导入会替换当前学习记录与自有题库。建议先导出当前备份。确认导入？'))return;questions.splice(0,questions.length,...questions.filter(q=>!q.id.startsWith('custom-')),...(d.custom||[]));state={...fresh(),...d,version:2,custom:d.custom||[],reviews:d.reviews||{},causes:d.causes||{},labs:d.labs||{},settings:{daily:[10,20,30,50].includes(d.settings?.daily)?d.settings.daily:20},activePractice:d.activePractice||null};for(let [id,w] of Object.entries(state.wrong))if(!state.reviews[id])state.reviews[id]={streak:w.mastered?2:0,due:Date.now(),last:0};cleanConfig={dedupe:false,trim:false,invalid:false,missing:'keep',...state.labs.clean?.config};labelDraft=state.labs.label?.answers||{};flowOrder=state.labs.flow?.order||[3,0,7,1,5,2,6,4];sqlDraft=state.labs.sql?.query||'SELECT id, text FROM samples WHERE label IS NULL;';metricDraft=state.labs.metrics?.answers||['','',''];session=null;result=null;save();render();toast('备份已恢复，包括自有题库与实操记录')}catch(e){toast('导入失败：'+e.message)}finally{ev.target.value=''}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
window.addEventListener('beforeunload',()=>{if(session&&!session.exam)persistSession()});
render();
